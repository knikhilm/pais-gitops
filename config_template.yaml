# ============================================================
# VCF Private AI Services (PAIS) - Unified Configuration File
# ============================================================
# Declaratively manages both Kubernetes Control Plane CRDs
# (ModelEndpoints & InferenceGatewayRoutes) and REST Data/Agent Plane resources
# (Data Sources, Knowledge Bases, Indexes, MCP Servers, and Agents).
# ============================================================

# ----------------------------------------------------------
# Connection & Authentication
# ----------------------------------------------------------
pais:
  base_url: "${PAIS_BASE_URL}"              # REST Data/Agent Plane API endpoint
  auth:
    token_url: "${PAIS_TOKEN_URL}"
    client_id: "${PAIS_CLIENT_ID}"
    scope: "openid"
    username: "${PAIS_USERNAME}"
    password: "${PAIS_PASSWORD}"
    verify_ssl: true
  rex_discovery_timeout_seconds: 30

kubernetes:
  namespace: "default"                      # Default K8s namespace for CRDs

  # ----------------------------------------------------------
  # Kubernetes Cluster Authentication & Login Options
  # ----------------------------------------------------------
  # Method 1: VCF CLI Authentication (vcf context create & vcf context use)
  # Authenticates to the VCF Cluster via official VCF CLI
  vsphere:
    server: "${VCF_ENDPOINT}"               # e.g. auto-vip.vcf05.showcase.tmm.broadcom.lab
    api_token: "${VCF_API_TOKEN}"           # e.g. fie78N9wJNSGllIhrtq9IqrvbRGWpKTR (or use username/password)
    username: "${VCF_USER}"                 # Fallback if api_token not provided
    password: "${VCF_PASSWORD}"             # Fallback if api_token not provided
    type: "cci"                             # e.g. cci or vsphere
    auth_type: "basic"                      # e.g. basic
    tenant_name: "all-apps"                 # e.g. all-apps
    namespace: "${VCF_NAMESPACE}"           # e.g. paif-4hqfz
    project_name: "${VCF_PROJECT}"         # e.g. paif-project
    context_name: "vcf05paif"               # Target context name -> vcf context use vcf05paif:paif-4hqfz:paif-project

  # Method 2: OCI / Harbor Registry Pull Secret Provisioning
  # Automatically creates a kubernetes.io/dockerconfigjson Secret in the namespace
  # so VKS worker nodes can pull OCI model artifacts (oci_ref) from Harbor
  # Configured for self-signed certificates (insecure TLS or CA certificate)
  registry:
    server: "${HARBOR_REGISTRY}"            # e.g. harbor.internal.example.com
    username: "${HARBOR_USERNAME}"
    password: "${HARBOR_PASSWORD}"
    secret_name: "harbor-registry-secret"
    insecure: true                          # Set to true for self-signed SSL certificates / insecure HTTP
    insecure_skip_tls_verify: true          # Skip TLS verification when pulling model weights
    ca_cert: "${HARBOR_CA_CERT}"            # (Optional) PEM self-signed CA cert content

# ============================================================
# 1. KUBERNETES MODEL ENDPOINTS (pais.vmware.com/v1alpha1 -> ModelEndpoint)
# ============================================================
# Requests to serve AI models on vSphere/VKS node pools using vLLM, Infinity, or LlamaCPP
model_endpoints:
  - name: "llama3-8b-endpoint"
    namespace: "default"
    type: "Completions"                     # Completions | Embeddings
    engine: "vLLM"                          # vLLM | Infinity | LlamaCPP
    routing_name: "meta-llama/Meta-Llama-3.1-8B-Instruct"
    replicas: 1
    virtual_machine_class_name: "nvidia-a10g-gpu-class"
    storage_class_name: "vsan-default-storage-class"
    failure_domain: "zone-1"
    model:
      oci_ref: "harbor.internal.example.com/pais/models/meta-llama-3.1-8b-instruct:v1"
      pull_secrets:
        - name: "harbor-registry-secret"
    inference_server_customization:
      cli_args:
        - "--max-model-len=8192"
        - "--gpu-memory-utilization=0.90"
      env_vars:
        - name: "PAIH_MODEL_ID"
          value: "meta-llama/Meta-Llama-3.1-8B-Instruct"
      shared_memory_mount_size: "2Gi"

  - name: "bge-small-endpoint"
    namespace: "default"
    type: "Embeddings"
    engine: "Infinity"
    routing_name: "BAAI/bge-small-en-v1.5"
    replicas: 1
    virtual_machine_class_name: "small-cpu-class"
    storage_class_name: "vsan-default-storage-class"
    model:
      oci_ref: "harbor.internal.example.com/pais/models/bge-small-en-v1.5:v1"
      pull_secrets:
        - name: "harbor-registry-secret"

# ============================================================
# 2. INFERENCE GATEWAY ROUTES (pais.vmware.com/v1alpha1 -> InferenceGatewayRoute)
# ============================================================
# Routing rules exposing models via the PAIS Data Plane API or routing to remote/external LLMs
inference_routes:
  - name: "route-llama3-8b"
    namespace: "default"
    type: "Completions"
    engine: "vLLM"
    matches:
      routing_name: "meta-llama/Meta-Llama-3.1-8B-Instruct"
    backend:
      http_base_url: "http://llama3-8b-endpoint.default.svc.cluster.local"
      model_id: "meta-llama/Meta-Llama-3.1-8B-Instruct"
      tls:
        verification: "strict"

  - name: "route-bge-small"
    namespace: "default"
    type: "Embeddings"
    engine: "Infinity"
    matches:
      routing_name: "BAAI/bge-small-en-v1.5"
    backend:
      http_base_url: "http://bge-small-endpoint.default.svc.cluster.local"
      model_id: "BAAI/bge-small-en-v1.5"
      tls:
        verification: "strict"

# ============================================================
# 3. REST DATA SOURCES
# ============================================================
data_sources:
  - name: "gdrive-product-docs"
    description: "Product documentation stored in Google Drive"
    type: "GOOGLE_DRIVE"
    origin_url: "https://drive.google.com/drive/u/0/folders/REPLACE_WITH_FOLDER_ID"
    credentials: "${GDRIVE_CREDENTIALS}"
    test_connection: true

  - name: "s3-support-articles"
    description: "Support KB articles stored in an S3 bucket"
    type: "S3"
    origin_url: "s3://my-bucket/support-articles/"
    credentials: "${S3_CREDENTIALS}"
    test_connection: true

# ============================================================
# 4. KNOWLEDGE BASES & INDEXES
# ============================================================
knowledge_bases:
  - name: "product-docs-kb"
    description: "Knowledge base for product documentation"
    data_origin_type: "DATA_SOURCES"
    index_refresh_policy:
      policy_type: "MANUAL"
    data_sources:
      - "gdrive-product-docs"
    index:
      name: "product-docs-index"
      description: "Sentence-split index with small BGE embeddings"
      embeddings_model_endpoint: "BAAI/bge-small-en-v1.5"
      text_splitting: "SENTENCE"
      chunk_size: 100
      chunk_overlap: 0
      trigger_indexing: true
      wait_for_indexing: true
      indexing_timeout_seconds: 300

  - name: "support-articles-kb"
    description: "Knowledge base for support articles"
    data_origin_type: "DATA_SOURCES"
    index_refresh_policy:
      policy_type: "MANUAL"
    data_sources:
      - "s3-support-articles"
    index:
      name: "support-articles-index"
      description: "Sentence-split index for support articles"
      embeddings_model_endpoint: "BAAI/bge-small-en-v1.5"
      text_splitting: "SENTENCE"
      chunk_size: 150
      chunk_overlap: 20
      trigger_indexing: true
      wait_for_indexing: true
      indexing_timeout_seconds: 300

# ============================================================
# 5. MCP SERVERS & TOOL APPROVALS
# ============================================================
mcp_servers:
  - name: "weather-service"
    description: "Real-time weather data MCP server"
    url: "https://weather-mcp-server.example.com"
    transport: "STREAMABLE_HTTP"
    approve_tools:
      - "get_current_weather"
      - "get_forecast"

  - name: "ticketing-service"
    description: "Internal ticketing system MCP server"
    url: "https://ticketing-mcp.internal.example.com"
    transport: "STREAMABLE_HTTP"
    approve_tools:
      - "create_ticket"
      - "search_tickets"
      - "update_ticket"

# ============================================================
# 6. AGENTS
# ============================================================
agents:
  - name: "product-support-agent"
    description: "Agent with access to product docs and support articles plus live tools"
    model: "meta-llama/Meta-Llama-3.1-8B-Instruct"
    instructions: >
      You are a helpful product-support assistant. Use the knowledge base to
      answer questions about products and support cases. When users ask about
      current weather or need to create/search tickets, use the appropriate
      tools. Always be polite and concise.
    completion_role: "assistant"
    session_max_length: 10000
    session_summarization_strategy: "delete_oldest"
    chat_system_instruction_mode: "system-message"
    index_reference_format: "structured"
    knowledge_bases:
      - name: "product-docs-kb"
        top_n: 5
        similarity_cutoff: 0.65
      - name: "support-articles-kb"
        top_n: 3
        similarity_cutoff: 0.70
    mcp_tools:
      - server: "weather-service"
        tool_name: "get_current_weather"
      - server: "ticketing-service"
        tool_name: "create_ticket"
      - server: "ticketing-service"
        tool_name: "search_tickets"
