name: PAIS GitOps (Multi-Tenant)

# Reconcile PAIS instances across all tenants whenever desired-state configs change.
# Supports Multi-Tenant Approach A (tenants/<tenant-name>/config.yaml).

on:
  push:
    branches: [ main ]
    paths:
      - "config.yaml"
      - "tenants/**/config.yaml"
      - "*.py"
      - ".github/workflows/pais-gitops.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log actions, make no API changes)"
        type: boolean
        default: false

concurrency:
  group: pais-gitops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile-tenants:
    runs-on: pais-gitops
    env:
      PYTHONUNBUFFERED: "1"
      # --- PAIS connection / OIDC (Default / Fallback) ---
      PAIS_BASE_URL: ${{ secrets.PAIS_BASE_URL }}
      PAIS_TOKEN_URL: ${{ secrets.PAIS_TOKEN_URL }}
      PAIS_CLIENT_ID: ${{ secrets.PAIS_CLIENT_ID }}
      PAIS_CLIENT_SECRET: ${{ secrets.PAIS_CLIENT_SECRET }}
      PAIS_USERNAME: ${{ secrets.PAIS_USERNAME }}
      PAIS_PASSWORD: ${{ secrets.PAIS_PASSWORD }}
      PAIS_TOKEN: ${{ secrets.PAIS_TOKEN }}
      PAIS_SCOPE: ${{ secrets.PAIS_SCOPE }}
      PAIS_VERIFY_SSL: ${{ secrets.PAIS_VERIFY_SSL || 'false' }}

      # --- PAIS Tenant Secrets: pais-shared-org ---
      PAIS_SHARED_BASE_URL: ${{ secrets.PAIS_SHARED_BASE_URL || secrets.PAIS_BASE_URL }}
      PAIS_SHARED_TOKEN_URL: ${{ secrets.PAIS_SHARED_TOKEN_URL || secrets.PAIS_TOKEN_URL }}
      PAIS_SHARED_CLIENT_ID: ${{ secrets.PAIS_SHARED_CLIENT_ID || secrets.PAIS_CLIENT_ID }}
      PAIS_SHARED_CLIENT_SECRET: ${{ secrets.PAIS_SHARED_CLIENT_SECRET || secrets.PAIS_CLIENT_SECRET }}
      PAIS_SHARED_USERNAME: ${{ secrets.PAIS_SHARED_USERNAME || secrets.PAIS_USERNAME }}
      PAIS_SHARED_PASSWORD: ${{ secrets.PAIS_SHARED_PASSWORD || secrets.PAIS_PASSWORD }}

      # --- PAIS Tenant Secrets: pais-all-apps ---
      PAIS_ALL_APPS_BASE_URL: ${{ secrets.PAIS_ALL_APPS_BASE_URL || secrets.PAIS_BASE_URL }}
      PAIS_ALL_APPS_TOKEN_URL: ${{ secrets.PAIS_ALL_APPS_TOKEN_URL || secrets.PAIS_TOKEN_URL }}
      PAIS_ALL_APPS_CLIENT_ID: ${{ secrets.PAIS_ALL_APPS_CLIENT_ID || secrets.PAIS_CLIENT_ID }}
      PAIS_ALL_APPS_CLIENT_SECRET: ${{ secrets.PAIS_ALL_APPS_CLIENT_SECRET || secrets.PAIS_CLIENT_SECRET }}
      PAIS_ALL_APPS_USERNAME: ${{ secrets.PAIS_ALL_APPS_USERNAME || secrets.PAIS_USERNAME }}
      PAIS_ALL_APPS_PASSWORD: ${{ secrets.PAIS_ALL_APPS_PASSWORD || secrets.PAIS_PASSWORD }}

      # --- Data-source credentials referenced as ${...} in configs ---
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      GDRIVE_ORIGIN_URL: ${{ secrets.GDRIVE_ORIGIN_URL }}
      S3_CREDENTIALS: ${{ secrets.S3_CREDENTIALS }}
      S3_ORIGIN_URL: ${{ secrets.S3_ORIGIN_URL }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}

      # --- VCF CLI / Kubeconfig login secrets (Default / Fallback) ---
      KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
      VCF_ENDPOINT: ${{ secrets.VCF_ENDPOINT || secrets.VSPHERE_SERVER }}
      VCF_API_TOKEN: ${{ secrets.VCF_API_TOKEN }}
      VCF_USER: ${{ secrets.VCF_USER || secrets.VSPHERE_USER }}
      VCF_PASSWORD: ${{ secrets.VCF_PASSWORD || secrets.VSPHERE_PASSWORD }}
      VCF_NAMESPACE: ${{ secrets.VCF_NAMESPACE || secrets.VSPHERE_NAMESPACE }}
      VCF_PROJECT: ${{ secrets.VCF_PROJECT || secrets.PROJECT_NAME }}

      # --- VCF CLI Tenant Secrets: pais-shared-org ---
      VCF_SHARED_ENDPOINT: ${{ secrets.VCF_SHARED_ENDPOINT || secrets.VCF_ENDPOINT }}
      VCF_SHARED_API_TOKEN: ${{ secrets.VCF_SHARED_API_TOKEN || secrets.VCF_API_TOKEN }}
      VCF_SHARED_USER: ${{ secrets.VCF_SHARED_USER || secrets.VCF_USER }}
      VCF_SHARED_PASSWORD: ${{ secrets.VCF_SHARED_PASSWORD || secrets.VCF_PASSWORD }}
      VCF_SHARED_NAMESPACE: ${{ secrets.VCF_SHARED_NAMESPACE || secrets.VCF_NAMESPACE }}
      VCF_SHARED_PROJECT: ${{ secrets.VCF_SHARED_PROJECT || secrets.VCF_PROJECT }}

      # --- VCF CLI Tenant Secrets: pais-all-apps ---
      VCF_ALL_APPS_ENDPOINT: ${{ secrets.VCF_ALL_APPS_ENDPOINT || secrets.VCF_ENDPOINT }}
      VCF_ALL_APPS_API_TOKEN: ${{ secrets.VCF_ALL_APPS_API_TOKEN || secrets.VCF_API_TOKEN }}
      VCF_ALL_APPS_USER: ${{ secrets.VCF_ALL_APPS_USER || secrets.VCF_USER }}
      VCF_ALL_APPS_PASSWORD: ${{ secrets.VCF_ALL_APPS_PASSWORD || secrets.VCF_PASSWORD }}
      VCF_ALL_APPS_NAMESPACE: ${{ secrets.VCF_ALL_APPS_NAMESPACE || secrets.VCF_NAMESPACE }}
      VCF_ALL_APPS_PROJECT: ${{ secrets.VCF_ALL_APPS_PROJECT || secrets.VCF_PROJECT }}

      # --- API Token Secrets for InferenceGatewayRoutes ---
      SHARED_MODELS_API_TOKEN: ${{ secrets.SHARED_MODELS_API_TOKEN }}
      ALL_APPS_BACKEND_API_TOKEN: ${{ secrets.ALL_APPS_BACKEND_API_TOKEN }}
      # --- OCI / Harbor Registry Credentials for Image Pull Secret ---
      HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      HARBOR_INSECURE: ${{ secrets.HARBOR_INSECURE || 'true' }}
      HARBOR_CA_CERT: ${{ secrets.HARBOR_CA_CERT }}
      DRY_RUN_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

    steps:
      - name: Checkout (with previous commit for removal detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Kubeconfig (if provided)
        if: env.KUBECONFIG_DATA != ''
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Discover and Reconcile All Tenant Configs (Priority Order)
        shell: bash
        env:
          BEFORE_COMMIT: ${{ github.event.before }}
        run: |
          python reconcile_all.py ${DRY_RUN_FLAG}

      - name: Upload Generated Kubernetes Manifests as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-pais-manifests
          path: k8s-manifests/
          if-no-files-found: ignore
