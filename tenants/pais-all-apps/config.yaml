# ============================================================
# VCF Private AI Services (PAIS) - Tenant: All Applications Org (pais-all-apps)
# ============================================================
# Declaratively manages PAIS resources for the All-Apps Org across:
#   - K8s Control Plane: ModelEndpoints & InferenceGatewayRoutes
#   - REST Data/Agent Plane: Data Sources, Knowledge Bases, MCP Servers, Agents
# ============================================================

pais:
  priority: 10                            # Priority 10: Application workloads run after shared models
  base_url: "${PAIS_ALL_APPS_BASE_URL}"      # PAIS All-Apps Org REST API Endpoint
  auth:
    token_url: "${PAIS_ALL_APPS_TOKEN_URL}"  # OIDC Token URL for All-Apps Org
    client_id: "${PAIS_ALL_APPS_CLIENT_ID}"
    client_secret: "${PAIS_ALL_APPS_CLIENT_SECRET}"
    scope: "openid groups offline_access"
    username: "${PAIS_ALL_APPS_USERNAME}"
    password: "${PAIS_ALL_APPS_PASSWORD}"
    verify_ssl: false
  mcp_tool_discovery_timeout_seconds: 60
  rex_discovery_timeout_seconds: 30

  # Kubernetes Cluster & VCFA Namespace for All Applications Org
  vsphere:
    server: "${VCF_ALL_APPS_ENDPOINT}"
    api_token: "${VCF_ALL_APPS_API_TOKEN}"
    username: "${VCF_ALL_APPS_USER}"
    password: "${VCF_ALL_APPS_PASSWORD}"
    type: "cci"
    auth_type: "basic"
    tenant_name: "pais-all-apps"
    namespace: "pais-vcfa-ntcwr"
    project_name: "ai-project"
    context_name: "vcf-pais-all-apps"

  registry:
    server: "${HARBOR_REGISTRY}"
    username: "${HARBOR_USERNAME}"
    password: "${HARBOR_PASSWORD}"
    secret_name: "harbor-registry-secret"
    insecure: true
    insecure_skip_tls_verify: true
    ca_cert: "${HARBOR_CA_CERT}"

  # API Token Secrets provisioned for InferenceGatewayRoute authentication
  api_tokens:
    - name: "shared-models-token"
      api_token: "vcfa:pais-all-apps:${VCF_ALL_APPS_API_TOKEN}"

# ============================================================
# 1. KUBERNETES MODEL ENDPOINTS (All-Apps Org)
# ============================================================
model_endpoints: []

# ============================================================
# 2. INFERENCE GATEWAY ROUTES (All-Apps Org)
# ============================================================
inference_routes:
  - name: "bge-m3-llm-service"
    type: "Embeddings"
    engine: "Infinity"
    matches:
      routing_name: "bge-m3-shared"
    backend:
      http_base_url: "https://10.138.217.12/api/v1/compatibility/openai"
      model_id: "bge-m3"
      tls:
        verification: "none"
      auth:
        api_token_ref:
          name: "shared-models-token"
  - name: "gpt-oss-20b-llm-service"
    type: "Completions"
    engine: "vLLM"
    matches:
      routing_name: "gpt-oss-20b-shared"
    backend:
      http_base_url: "https://10.138.217.12/api/v1/compatibility/openai"
      model_id: "gpt-oss-20b"
      tls:
        verification: "none"
      auth:
        api_token_ref:
          name: "shared-models-token"

# ============================================================
# 3. REST DATA SOURCES
# ============================================================
data_sources: []

# ============================================================
# 4. KNOWLEDGE BASES & INDEXES
# ============================================================
knowledge_bases: []

# ============================================================
# 5. MCP SERVERS & TOOL APPROVALS
# ============================================================
mcp_servers: []

# ============================================================
# 6. AGENTS
# ============================================================
agents: []

