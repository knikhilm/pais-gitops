# ============================================================
# VCF Private AI Services (PAIS) - Tenant: All Applications Org (pais-all-apps)
# ============================================================
# Declaratively manages PAIS resources for the All-Apps Org across:
#   - K8s Control Plane: ModelEndpoints & InferenceGatewayRoutes
#   - REST Data/Agent Plane: Data Sources, Knowledge Bases, MCP Servers, Agents
# ============================================================

pais:
  base_url: "${PAIS_ALL_APPS_BASE_URL}"      # PAIS All-Apps Org REST API Endpoint
  auth:
    token_url: "${PAIS_ALL_APPS_TOKEN_URL}"  # OIDC Token URL for All-Apps Org
    client_id: "${PAIS_ALL_APPS_CLIENT_ID}"
    client_secret: "${PAIS_ALL_APPS_CLIENT_SECRET}"
    scope: "openid groups offline_access"
    username: "${PAIS_ALL_APPS_USERNAME}"
    password: "${PAIS_ALL_APPS_PASSWORD}"
    verify_ssl: false
  mcp_tool_discovery_timeout_seconds: 60
  rex_discovery_timeout_seconds: 30

  # Kubernetes Cluster & VCFA Namespace for All Applications Org
  vsphere:
    server: "${VCF_ALL_APPS_ENDPOINT}"
    api_token: "${VCF_ALL_APPS_API_TOKEN}"
    username: "${VCF_ALL_APPS_USER}"
    password: "${VCF_ALL_APPS_PASSWORD}"
    type: "cci"
    auth_type: "basic"
    tenant_name: "all-apps"
    namespace: "${VCF_ALL_APPS_NAMESPACE}"
    project_name: "${VCF_ALL_APPS_PROJECT}"
    context_name: "vcf-pais-all-apps"

  registry:
    server: "${HARBOR_REGISTRY}"
    username: "${HARBOR_USERNAME}"
    password: "${HARBOR_PASSWORD}"
    secret_name: "harbor-registry-secret"
    insecure: true
    insecure_skip_tls_verify: true
    ca_cert: "${HARBOR_CA_CERT}"

  # API Token Secrets provisioned for InferenceGatewayRoute authentication
  api_tokens:
    - name: "all-apps-backend-token"
      api_token: "${ALL_APPS_BACKEND_API_TOKEN}"

# ============================================================
# 1. KUBERNETES MODEL ENDPOINTS (All-Apps Org)
# ============================================================
model_endpoints:
  - name: "gemma-2-9b-v6"
    type: "Completions"
    engine: "LlamaCPP"
    routing_name: "gemma-2-9b-v6"
    replicas: 1
    virtual_machine_class_name: "best-effort-2xlarge"
    storage_class_name: "lvn-vcf05-mgmt-cl01-optimal-datastore-default-policy-autoraid"
    model:
      oci_ref: "harbor01.vcf05.showcase.tmm.broadcom.lab/pais/gemma-2-9b-gguf:v1.0"
    inference_server_customization:
      cli_args: ["-c 8192", "-t 8", "-tb 8", "-b 512", "--no-mmap", "--parallel 1", "--cache-type-k q8_0", "--jinja", "--flash-attn off"]
      env_vars: []

# ============================================================
# 2. INFERENCE GATEWAY ROUTES (All-Apps Org)
# ============================================================
inference_routes:
  - name: "gemma-2-9b-v6-route"
    type: "Completions"
    engine: "LlamaCPP"
    matches:
      routing_name: "gemma-2-9b-v6"
    backend:
      http_base_url: "http://gemma-2-9b-v6.svc.cluster.local"
      model_id: "gemma-2-9b-v6"

# ============================================================
# 3. REST DATA SOURCES
# ============================================================
data_sources:
  - name: "vcf-blogs"
    description: "VCF blogs stored in an S3 bucket"
    type: "S3"
    origin_url: "${S3_ORIGIN_URL}"
    credentials:
      access_key: "${S3_ACCESS_KEY}"
      secret_key: "${S3_SECRET_KEY}"
    options:
      bucket: "blogs"
      prefix: ""
    test_connection: false

# ============================================================
# 4. KNOWLEDGE BASES & INDEXES
# ============================================================
knowledge_bases:
  - name: "vcf-blogs"
    description: "VCF Blogs"
    data_origin_type: "DATA_SOURCES"
    index_refresh_policy:
      policy_type: "MANUAL"
    data_sources:
      - "vcf-blogs"
    index:
      name: "vcf-blogs-index"
      description: ""
      embeddings_model_endpoint: "bge-small"
      text_splitting: "SENTENCE"
      chunk_size: 300
      chunk_overlap: 30
      trigger_indexing: true
      wait_for_indexing: true
      indexing_timeout_seconds: 600

# ============================================================
# 5. MCP SERVERS & TOOL APPROVALS
# ============================================================
mcp_servers:
  - name: "lab-mcp-server"
    description: "Lab MCP server"
    url: "http://10.138.218.135/sse"
    transport: "SSE"
    approve_tools:
      - "Get the current time"

# ============================================================
# 6. AGENTS
# ============================================================
agents:
  - name: "product-support-agent"
    description: "Agent with access to product docs and support articles plus live tools"
    model: "gemma-2-9b-v6"
    instructions: >
      You are a helpful product-support assistant. If you don't know the answer, say "I don't know".
    completion_role: "assistant"
    session_max_length: 10000
    session_summarization_strategy: "delete_oldest"
    chat_system_instruction_mode: "system-message"
    index_reference_format: "markdown"
    index_reference_delimiter: "\npais-chat-marker\n"
    knowledge_bases:
      - name: "vcf-blogs"
        top_n: 3
        similarity_cutoff: 0.5
    mcp_tools:
      - server: "lab-mcp-server"
        tool_name: "Get the current time"
